<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: cream "gift paper" page, sage-green brand, brushed-silver accents; the logo's line–dot–line rule divides sections. */
:root{
  --cream:#FBF3E7; --paper:#FFFAF2; --line:#E6DCCB;
  --sage:#6F977A; --sage-deep:#4C6F56; --sage-soft:#E3ECE2;
  --ink:#26302A; --muted:#6B716A;
  --silver-1:#8B8D8A; --silver-2:#E4E5E1; --silver-3:#A6A8A4; --silver-ink:#3E423F;
  --warn:#B4762C; --ok:#4C8A5C;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 10px 30px -18px rgba(38,48,42,.35);
  --f-display:"Montserrat","Manrope",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cream:#121814; --paper:#1A221D; --line:#2C362F;
  --sage:#8DB596; --sage-deep:#A9CBB0; --sage-soft:#22302A;
  --ink:#EEE9DF; --muted:#A3A89F;
  --silver-1:#7A7C79; --silver-2:#D9DAD6; --silver-3:#9C9E9A; --silver-ink:#1C1F1D;
  --warn:#E0A55B; --ok:#7FC291;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 30px -16px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --cream:#121814; --paper:#1A221D; --line:#2C362F;
  --sage:#8DB596; --sage-deep:#A9CBB0; --sage-soft:#22302A;
  --ink:#EEE9DF; --muted:#A3A89F;
  --silver-1:#7A7C79; --silver-2:#D9DAD6; --silver-3:#9C9E9A; --silver-ink:#1C1F1D;
  --warn:#E0A55B; --ok:#7FC291;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 30px -16px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.5rem,3vw,2.15rem);font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:inherit}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--sage);outline-offset:3px;border-radius:6px}

/* the logo's divider: line · dot · line */
.rule{display:flex;align-items:center;gap:10px;color:var(--sage);margin:0 auto;max-width:220px}
.rule::before,.rule::after{content:"";flex:1;height:2px;background:currentColor;border-radius:2px;opacity:.8}
.rule i{width:6px;height:6px;border-radius:50%;background:currentColor}

/* silver metal surface, like the "N" bag */
.metal{background:linear-gradient(135deg,var(--silver-1) 0%,var(--silver-2) 38%,var(--silver-3) 58%,var(--silver-2) 80%,var(--silver-1) 100%);color:var(--silver-ink)}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--cream) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img{width:44px;height:auto}
.brand b{font-family:var(--f-display);font-weight:800;color:var(--sage);font-size:1.15rem;line-height:1}
.brand small{display:block;font-family:var(--f-display);font-weight:700;font-size:.72rem;color:var(--silver-1);letter-spacing:.02em}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{text-decoration:none;font-weight:600;font-size:.93rem;padding:8px 12px;border-radius:10px;color:var(--ink)}
nav.main a:hover{background:var(--sage-soft)}
.tools{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.lang button{border:0;background:none;font:600 .8rem var(--f-body);color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sage);color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:700 .95rem var(--f-body);padding:12px 20px;border-radius:12px;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--sage);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 8px 20px -10px var(--sage)}
:root[data-theme="dark"] .btn-primary{color:#10160F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#10160F}}
.btn-primary:hover{box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 12px 24px -10px var(--sage)}
.btn-metal{border:1px solid var(--silver-3)}
.btn-ghost{background:transparent;color:var(--sage-deep);border:1.5px solid var(--sage)}
.btn-sm{padding:8px 14px;font-size:.85rem;border-radius:10px}
.menu-toggle{display:none}

/* hero */
.hero{padding-block:56px 40px;text-align:center;display:grid;gap:18px;justify-items:center}
.hero .mark{width:120px}
.hero p.lead{max-width:56ch;color:var(--muted);font-size:1.08rem}
.hero h1 em{font-style:normal;color:var(--sage)}

.pillars{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-bottom:56px}
.pillar{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px;display:grid;gap:14px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.pillar::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--sage-soft),transparent 70%);pointer-events:none}
.pillar .tag{justify-self:start;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.pillar ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.pillar li{display:flex;gap:10px;align-items:baseline;color:var(--muted)}
.pillar li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sage);flex-shrink:0;transform:translateY(-2px)}
.pillar .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

section.block{padding-block:56px;border-top:1px solid var(--line)}
.head{display:grid;gap:12px;text-align:center;justify-items:center;margin-bottom:32px}
.head p{color:var(--muted);max-width:60ch}

/* services */
.services{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.svc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:10px;align-content:start;min-width:0}
.svc .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.svc .ic svg{width:22px;height:22px}
.svc p{color:var(--muted);font-size:.93rem}
.svc .price{font-family:var(--f-display);font-weight:700;color:var(--sage-deep);font-size:.95rem;font-variant-numeric:tabular-nums}
.svc a{font-weight:700;color:var(--sage-deep);text-decoration:none;font-size:.9rem}

/* rental market */
.market-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.market-tools input,.market-tools select{font:500 .92rem var(--f-body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
.market-tools input{flex:1 1 220px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid;min-width:0}
.card .art{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;position:relative}
.card .art svg{width:46%;height:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
.card .sample{position:absolute;top:10px;left:10px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px}
.card .body{padding:16px 18px 18px;display:grid;gap:10px}
.attrs{display:flex;gap:6px;flex-wrap:wrap}
.attrs span{font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--sage-soft);color:var(--sage-deep)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{font:600 .8rem var(--f-body);padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.days button[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-soft);color:var(--sage-deep)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.total b{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.total small{color:var(--muted)}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card .row .btn{flex:1}

/* stars calculator */
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:26px;display:grid;gap:16px;box-shadow:var(--shadow);min-width:0}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.field input{font:600 1.05rem var(--f-body);padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font-variant-numeric:tabular-nums}
.field .hint{font-size:.82rem;color:var(--muted)}
.field .err{font-size:.82rem;color:var(--warn);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;font:600 .88rem var(--f-body);padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;min-width:0}
.seg button[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-soft);color:var(--sage-deep)}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;border-top:1px dashed var(--line)}
.sum b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.premium-list{display:grid;gap:10px}
.prem{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.prem b{font-family:var(--f-display)}
.prem .note{font-size:.78rem;color:var(--muted)}
.prem .val{font-weight:700;color:var(--sage-deep);font-variant-numeric:tabular-nums;text-align:right}

/* installments */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.plan{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:12px;align-content:start;min-width:0}
.plan .badge{justify-self:start;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--sage-soft);color:var(--sage-deep)}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.plan li{display:flex;gap:8px;font-size:.93rem}
.plan li::before{content:"✓";color:var(--sage);font-weight:800}
.plan .for{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.callout{margin-top:22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px 22px;border-radius:16px;border:1px dashed var(--sage);background:var(--sage-soft)}
.callout p{font-weight:600;color:var(--sage-deep);max-width:60ch}

/* steps (real order of an order) */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;gap:8px;padding:18px;border-left:2px solid var(--sage);min-width:0}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--sage)}
.steps p{color:var(--muted);font-size:.93rem}

/* faq */
.faq{max-width:760px;margin:0 auto;display:grid;gap:10px}
.faq details{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 18px}
.faq summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--sage);font-weight:800;font-size:1.2rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{padding-bottom:14px;color:var(--muted)}

footer{border-top:1px solid var(--line);padding-block:36px;margin-top:20px}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.foot p{color:var(--muted);font-size:.9rem}
.copy{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.copy code{font:600 .95rem var(--f-body);background:var(--paper);border:1px solid var(--line);padding:6px 10px;border-radius:8px;user-select:all}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20}

@media (max-width:980px){
  .services{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:repeat(2,1fr)}
  .plans{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
  nav.main{display:none}
  nav.main.open{display:grid;position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
  .menu-toggle{display:inline-flex;margin-left:auto}
  .bar{position:relative;flex-wrap:wrap}
}
@media (max-width:640px){
  .pillars{grid-template-columns:1fr}
  .services,.cards,.steps{grid-template-columns:1fr}
  .tools .login{display:none}
  .lang button{padding:5px 8px}
  .brand small{display:none}
  .hero{padding-block:36px 28px}
}
@media (prefers-reduced-motion:no-preference){
  .pillar,.card{transition:transform .25s ease,box-shadow .25s ease}
  .pillar:hover,.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px rgba(38,48,42,.45)}
}
</style>

<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#top" aria-label="NAZAROVtggifts">
      <img src="assets/logo-mark.png" alt="">
      <span><b>Nazarov</b><small>TG Gifts</small></span>
    </a>
    <nav class="main" id="nav">

      <a href="#faq" data-i="nav_faq"></a>

</header>

          <li data-i="p1_l3"></li>

      <article class="pillar">
        <span class="tag metal" data-i="p2_tag"></span>
        <h2 data-i="p2_title"></h2>
        <p data-i="p2_text"></p>
        <ul>
          <li data-i="p2_l1"></li>
          <li data-i="p2_l2"></li>
          <li data-i="p2_l3"></li>
        </ul>

    </div>

  <section class="block" id="rent">
    <div class="wrap">
      <div class="head">
        <div class="eyebrow" data-i="rent_eyebrow"></div>

          <h3 data-i="s2_t"></h3><p data-i="s2_d"></p>
          <a href="#rent" data-i="more"></a>
        </article>
        <article class="svc">
          <span class="ic metal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.6 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg></span>
          <h3>Telegram Premium</h3><p data-i="s3_d"></p>
          <span class="price" data-i="s3_p"></span>
          <a href="#stars" data-i="more"></a>
        </article>
        <article class="svc">
          <span class="ic metal"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.3L21 9l-5 4.4L17.5 20 12 16.7 6.5 20 8 13.4 3 9l6.4-.7z"/></svg></span>
          <h3>Telegram Stars</h3><p data-i="s4_d"></p>

  <section class="block" id="stars">
    <div class="wrap split">
      <form class="panel" id="starsForm" novalidate>
        <div class="eyebrow">Telegram Stars</div>
        <h2 data-i="stars_title"></h2>
        <div class="field">
          <label for="qty" data-i="qty"></label>
          <input id="qty" type="number" inputmode="numeric" min="50" step="1" value="100">
          <span class="hint" data-i="qty_hint"></span>
          <span class="err" id="qtyErr" hidden data-i="qty_err"></span>
        </div>
        <div class="field">

const LOCALE={uz:"uz-UZ",ru:"ru-RU",en:"en-US",zh:"zh-CN"};
const CUR={uz:"so'm",ru:"сум",en:"UZS",zh:"苏姆"};
let lang="uz";
try{const s=localStorage.getItem("ng_lang");if(s&&T[s])lang=s}catch(e){}

// Rental formula: (P + add) × mult × rate, no rounding. Admin-configurable.
const RENT={add:0.15,mult:2,rate:19000};
const rentPrice=P=>(P+RENT.add)*RENT.mult*RENT.rate;
const STAR_PRICE=250, STAR_MIN=50;

// Design samples only — real items come from Marketapp /v1/rent/gifts/.
const SAMPLES=[
 {name:"Gift #1042",model:"Model A",bg:"Backdrop 1",sym:"Symbol 1",ppd:0.42,c1:"#C9DCC8",c2:"#7FA488",days:[1,3,7,14]},
 {name:"Gift #318",model:"Model B",bg:"Backdrop 2",sym:"Symbol 2",ppd:0.75,c1:"#E9DCC4",c2:"#B99A6B",days:[1,3,7]},
 {name:"Gift #2207",model:"Model C",bg:"Backdrop 3",sym:"Symbol 3",ppd:1.1,c1:"#D9DDE2",c2:"#8E979F",days:[1,7,30]}
];
const fmt=n=>new Intl.NumberFormat(LOCALE[lang],{maximumFractionDigits:2}).format(n)+" "+CUR[lang];

function giftSVG(){return '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="16" y="40" width="68" height="50" rx="6" fill="rgba(255,255,255,.9)"/><rect x="10" y="28" width="80" height="16" rx="5" fill="#fff"/><rect x="45" y="28" width="10" height="62" fill="#6F977A"/><path d="M50 28c-6-14-24-16-24-6s18 6 24 6zm0 0c6-14 24-16 24-6s-18 6-24 6z" fill="none" stroke="#6F977A" stroke-width="5" stroke-linejoin="round"/></svg>'}

function renderCards(){
  const t=T[lang],box=document.getElementById("cards");
  box.innerHTML=SAMPLES.map((g,i)=>`<article class="card">
    <div class="art" style="background:radial-gradient(circle at 50% 40%,${g.c1},${g.c2})">${giftSVG()}<span class="sample metal">${t.sample}</span></div>
    <div class="body">
      <h3>${g.name}</h3>
      <div class="attrs"><span>${g.model}</span><span>${g.bg}</span><span>${g.sym}</span></div>
      <div class="days" role="group" aria-label="${t.day_label}">${g.days.map((d,j)=>`<button type="button" data-card="${i}" data-d="${d}" aria-pressed="${j===0}">${d} ${t.days}</button>`).join("")}</div>
      <div class="total"><small id="lbl${i}"></small><b id="sum${i}"></b></div>
      <div class="row"><button class="btn btn-primary btn-sm" type="button" data-act="order">${t.rent_cash}</button><button class="btn btn-ghost btn-sm" type="button" data-act="order">${t.rent_inst}</button></div>
    </div></article>`).join("");
  SAMPLES.forEach((g,i)=>setCard(i,g.days[0]));
}
function setCard(i,d){
  const g=SAMPLES[i],t=T[lang];
  document.querySelectorAll(`[data-card="${i}"]`).forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.d===d)));
  document.getElementById("lbl"+i).textContent=t.total_for.replace("{d}",d);
  document.getElementById("sum"+i).textContent=fmt(rentPrice(g.ppd*d));
}

function updateStars(){
  const q=parseInt(document.getElementById("qty").value,10),err=document.getElementById("qtyErr");
  const ok=Number.isFinite(q)&&q>=STAR_MIN;
  err.hidden=ok;
  document.getElementById("starsSum").textContent=ok?fmt(q*STAR_PRICE):"—";
  return ok;
}

function apply(){
  const t=T[lang];
  document.documentElement.lang=lang==="zh"?"zh-CN":lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=t[el.dataset.i];if(v==null)return;if(el.hasAttribute("data-html"))el.innerHTML=v;else el.textContent=v});
  document.querySelectorAll("[data-ph]").forEach(el=>el.placeholder=t[el.dataset.ph]);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  renderCards();updateStars();
}

let toastTimer;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2600)}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem("ng_lang",lang)}catch(_){}apply();return}
  if(b.dataset.card!=null){setCard(+b.dataset.card,+b.dataset.d);return}
  if(b.dataset.rcp){document.querySelectorAll("[data-rcp]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));document.getElementById("rcpUser").hidden=b.dataset.rcp!=="other";return}
  if(b.dataset.pay){document.querySelectorAll("[data-pay]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));return}
  if(b.dataset.act==="order"){toast(T[lang].ordered);return}
  if(b.classList.contains("login")){toast(T[lang].login_note);return}
  if(b.id==="menuBtn"){const n=document.getElementById("nav");const o=n.classList.toggle("open");b.setAttribute("aria-expanded",String(o));return}
  if(b.id==="copyBtn"){const txt=document.getElementById("oid").textContent;
    const done=()=>toast(T[lang].copied);
    try{navigator.clipboard.writeText(txt).then(done,()=>selectOid())}catch(_){selectOid()}}
});
function selectOid(){const r=document.createRange();r.selectNodeContents(document.getElementById("oid"));const s=getSelection();s.removeAllRanges();s.addRange(r)}
document.getElementById("nav").addEventListener("click",e=>{if(e.target.closest("a")){e.currentTarget.classList.remove("open");document.getElementById("menuBtn").setAttribute("aria-expanded","false")}});
document.getElementById("qty").addEventListener("input",updateStars);
document.getElementById("starsForm").addEventListener("submit",e=>{e.preventDefault();if(updateStars())toast(T[lang].ordered)});
apply();
</script>
